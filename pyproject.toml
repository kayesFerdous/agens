[project]
name = "agens"
version = "0.1.1"
description = "An interface-agnostic AI agent platform that executes complex system-level and web tasks through a centralized ReAct orchestration engine."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "kayesFerdous" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "beautifulsoup4>=4.14.3",
    "cryptography>=46.0.5",
    "ddgs>=9.14.4",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "markdown>=3.10.2",
    "openai>=2.37.0",
    "platformdirs>=4.9.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0.post0",
    "python-telegram-bot>=22.7",
    "sqlalchemy[asyncio]>=2.0.48",
    "textual>=0.60.0",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "validate-pyproject>=0.16",
]

[project.urls]
Homepage = "https://github.com/kayesFerdous/agens"
Repository = "https://github.com/kayesFerdous/agens.git"
"Bug Tracker" = "https://github.com/kayesFerdous/agens/issues"
Documentation = "https://github.com/kayesFerdous/agens#readme"

[project.scripts]
agens = "agens.main:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"agens._bundled_assets" = ["**/*"]
"db.migrations" = ["script.py.mako", "versions/*.py"]
"interfaces.web" = ["dist/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
